[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA upload configuration (use after initial USB flash)
; To upload via OTA: pio run -t upload --upload-port 192.168.4.1
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=teensy41

; For initial USB upload, use: pio run -t upload -e esp32dev_usb

[env:esp32dev_usb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
