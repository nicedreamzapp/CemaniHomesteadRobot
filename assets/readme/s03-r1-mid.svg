<svg xmlns="http://www.w3.org/2000/svg" width="560" height="215" viewBox="0 0 560 215" role="img" aria-label="Natural language. It understands natural language, moves autonomously, and reports back. Unrecognized text. Anything unrecognized goes to Claude, which maps it to one of the commands. The HTTP API works alone. Phone control needs your own bridge; the HTTP API works without it."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="125" rx="10"/></clipPath><rect width="275.0" height="125" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="274.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">💬 Natural language</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">It understands natural language,</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">moves autonomously, and</text><text x="140" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">reports back.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="125" rx="10"/></clipPath><rect width="275.0" height="125" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🧠 Unrecognized text</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Anything unrecognized goes to</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">Claude, which maps it to one of</text><text x="140" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">the commands.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a6a3a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🔌 The HTTP API works alone</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Phone control needs your own bridge; the HTTP API works without it.</text></g></g></svg>
