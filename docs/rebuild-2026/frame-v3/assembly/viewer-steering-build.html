<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cemani front steering: it builds itself</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e8e8ec;font-family:-apple-system,sans-serif;color:#16181d;overflow:hidden}
#wrap{position:fixed;inset:0} canvas{display:block;width:100%;height:100%}
#ctl{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;font-size:14px;z-index:10;flex-wrap:wrap;max-width:calc(100vw - 24px)}
#ctl b{font-size:16px} #ctl button{font-size:15px;padding:6px 14px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer}
#bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:10} #bar i{display:block;height:100%;width:0;background:#1f5fb3}
#step{position:absolute;top:70px;left:12px;max-width:min(760px,calc(100vw - 24px));background:#fff;border-left:5px solid #d08a00;padding:12px 16px;border-radius:8px;font-size:18px;line-height:1.4;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.12)}
#step small{display:block;color:#666;font-size:13px;margin-bottom:3px}
#key{position:absolute;bottom:14px;left:12px;background:rgba(255,255,255,.9);padding:8px 12px;border-radius:10px;font-size:13px;z-index:10;display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100vw - 24px)}
#key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#tag{position:absolute;z-index:9;background:#1f5fb3;color:#fff;font-size:14px;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-140%)}
body.rec #ctl button, body.rec #bar{display:none}
</style></head><body>
<div id="wrap">
<div id="ctl"><b>CEMANI FRONT STEERING BUILDS ITSELF</b><button id="play">❚❚ Pause</button><button id="prev">◀ Back</button><button id="next">Next ▶</button><button id="again">↻ Replay</button></div>
<div id="step"></div><div id="tag"></div>
<div id="key"><span><i style="background:#a3a7ad"></i>2020 frame</span><span><i style="background:#c9962f"></i>bearings</span><span><i style="background:#9fb7d6"></i>new steering plate</span><span><i style="background:#1d1e21"></i>black plate (yours)</span><span><i style="background:#d8dade"></i>spacers</span><span><i style="background:#55595f"></i>bolts, nuts, washers</span><span><i style="background:#3a3d42"></i>actuator</span></div>
<div id="bar"><i></i></div>
<canvas id="c"></canvas>
</div>
<script src="steps.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// Every size in mm. Frame layout and the corner stack come from docs/rebuild-2026/frame-v3 (cemani_frame_v3.py,
// make_plates.py); part sizes from the parts listings (parts/specs.json). Pure function of time t, so ?record
// renders the MP4 frame by frame from the same code.
const D=window.DIMS;
const XR=142.5, YAX=228.6, YACT=32, YE=272.5;
const COL={rail:0xa3a7ad,brg:0xc9962f,plate:0x9fb7d6,black:0x1d1e21,spacer:0xd8dade,bolt:0x55595f,act:0x3a3d42,chrome:0xe4e6ea};
const REC=new URLSearchParams(location.search).has('record'); if(REC) document.body.classList.add('rec');
THREE.Object3D.DEFAULT_UP.set(0,0,1);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(REC?1:devicePixelRatio); renderer.setClearColor(0xe8e8ec);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,1,20000); cam.up.set(0,0,1);
const ctl=new OrbitControls(cam,renderer.domElement); ctl.enableDamping=!REC;
let userCam=false; renderer.domElement.addEventListener('pointerdown',()=>userCam=true); renderer.domElement.addEventListener('wheel',()=>userCam=true);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const d1=new THREE.DirectionalLight(0xffffff,1.5); d1.position.set(300,500,-200); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,0.8); d2.position.set(-300,-200,500); scene.add(d2);
scene.add(new THREE.HemisphereLight(0xddeeff,0x777777,0.6));
const M=c=>new THREE.MeshStandardMaterial({color:c,metalness:(c===COL.black||c===COL.act)?0.3:0.55,roughness:0.42,side:THREE.DoubleSide});
// ---- shape helpers (z up) ----
function box(sx,sy,sz,c,x=0,y=0,z=0){ const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),M(c)); m.position.set(x,y,z); return m; }
function cyl(r,h,c,x=0,y=0,z=0,seg=40,r2){ const g=new THREE.CylinderGeometry(r,r2??r,h,seg); g.rotateX(Math.PI/2); const m=new THREE.Mesh(g,M(c)); m.position.set(x,y,z); return m; }
function ring(ro,ri,h,c,x=0,y=0,z=0,seg=40){ const s=new THREE.Shape(); s.absarc(0,0,ro,0,Math.PI*2); const p=new THREE.Path(); p.absarc(0,0,ri,0,Math.PI*2,true); s.holes.push(p);
  const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:seg}); g.translate(0,0,-h/2); const m=new THREE.Mesh(g,M(c)); m.position.set(x,y,z); return m; }
function rodBetween(a,b,r,c,seg=20){ const d=new THREE.Vector3().subVectors(b,a), L=d.length(); const g=new THREE.CylinderGeometry(r,r,L,seg); const m=new THREE.Mesh(g,M(c));
  m.position.copy(a).addScaledVector(d,0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()); return m; }
function screw(dia,len,head,c=COL.bolt,flat=false){ // shaft along -z from z=0 (head on top at z 0..head)
  const g=new THREE.Group(); g.add(cyl(dia/2,len,c,0,0,-len/2,20));
  if(flat) g.add(cyl(dia,dia*0.55,c,0,0,dia*0.275,30,dia/2)); else g.add(cyl(dia*0.85,head,c,0,0,head/2,6)); return g; }
function nut(dia,h,c=COL.bolt){ return ring(dia*0.9,dia/2,h,c,0,0,0,6); }
function washer(dout,din,h,c=COL.bolt){ return ring(dout/2,din/2,h,c); }
// 2020 rail with a T-slot look
function rail(len,axis,x,y,z){ const g=new THREE.Group(); const s=new THREE.Shape(); const h=10;
  s.moveTo(-h,-h); s.lineTo(-3,-h); s.lineTo(-3,-h+1.8); s.lineTo(3,-h+1.8); s.lineTo(3,-h); s.lineTo(h,-h); s.lineTo(h,-3); s.lineTo(h-1.8,-3); s.lineTo(h-1.8,3); s.lineTo(h,3);
  s.lineTo(h,h); s.lineTo(3,h); s.lineTo(3,h-1.8); s.lineTo(-3,h-1.8); s.lineTo(-3,h); s.lineTo(-h,h); s.lineTo(-h,3); s.lineTo(-h+1.8,3); s.lineTo(-h+1.8,-3); s.lineTo(-h,-3); s.closePath();
  const geo=new THREE.ExtrudeGeometry(s,{depth:len,bevelEnabled:false}); geo.translate(0,0,-len/2); const m=new THREE.Mesh(geo,M(COL.rail));
  if(axis==='y') m.rotation.x=Math.PI/2; if(axis==='x') m.rotation.y=Math.PI/2; m.position.set(x,y,z); g.add(m); return g; }
// steering plate outline (make_plates.py), u = outward, v = toward the frame end
const OUTL=[[-42,50],[38,50],[38,-70],[14,-95],[-42,-95]];
function steerPlate(sx,right){ const s=new THREE.Shape(); OUTL.forEach(([u,v],i)=>{ const x=sx*u; i?s.lineTo(x,v):s.moveTo(x,v); }); s.closePath();
  const hole=(u,v,r)=>{ const p=new THREE.Path(); p.absarc(sx*u,v,r,0,Math.PI*2,true); s.holes.push(p); };
  hole(0,0,12.5/2); D.slots.forEach(([u,v])=>hole(u,v,4)); hole(D.arm[0],D.arm[1],8.2/2); if(right) hole(D.acth[0],D.acth[1],6.6/2);
  const g=new THREE.ExtrudeGeometry(s,{depth:D.plateT,bevelEnabled:false,curveSegments:24}); return new THREE.Mesh(g,M(COL.plate)); }
// ---- build parts: each part = {id, obj, from:Vector3 offset it travels in from, at: label point} ----
const P={}; const add=(id,obj,from,label)=>{ const g=new THREE.Group(); g.add(obj); scene.add(g); P[id]={g,from:from||new THREE.Vector3(0,0,-120),label,home:g.position.clone()}; return g; };
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
// frame (always there)
const frame=new THREE.Group(); scene.add(frame);
frame.add(rail(600,'y',-XR,0,10)); frame.add(rail(600,'y',XR,0,10)); frame.add(rail(305-40,'x',0,YE+7,10)); frame.add(rail(305-40,'x',0,YACT,10));
// stack heights below the rail bottom (z=0)
const zB=-D.brgH, zT=zB-D.thrH, zN=zT-D.nutH, zP=zN-D.plateT, zK=zP-D.blackT;
function corner(sx,right,pre){
  const cx=sx*XR, cy=YAX;
  // T-nuts in the rail slot + ear bolts + washers
  for(const ey of [-D.earC/2,D.earC/2]){
    add(pre+'tnut'+ey, box(6,10,4,COL.bolt,cx,cy+ey,1.8), V(0,0,0).setY(ey<0?-90:90));
    const w=washer(D.earWasher,D.earBolt+0.5,1.6); w.position.set(cx,cy+ey,-D.earT-0.8);
    const b=screw(D.earBolt,D.earBoltL,D.earBolt*0.7); b.rotation.x=Math.PI; b.position.set(cx,cy+ey,-D.earT-1.6);
    const gb=new THREE.Group(); gb.add(b,w); add(pre+'earbolt'+ey,gb,V(0,0,-90));
  }
  const brg=new THREE.Group();
  const ears=new THREE.Shape(); const L=D.earL/2, W=D.earW/2;
  ears.moveTo(-W,-L+W); ears.absarc(0,-L+W,W,Math.PI,0,false); ears.lineTo(W,L-W); ears.absarc(0,L-W,W,0,Math.PI,false); ears.closePath();
  for(const ey of [-D.earC/2,D.earC/2]){ const h=new THREE.Path(); h.absarc(0,ey,D.earHole/2,0,Math.PI*2,true); ears.holes.push(h); }
  const eg=new THREE.ExtrudeGeometry(ears,{depth:D.earT,bevelEnabled:false,curveSegments:24}); eg.translate(0,0,-D.earT); const em=new THREE.Mesh(eg,M(COL.brg)); brg.add(em);
  brg.add(ring(D.brgOD/2,D.bore/2,D.brgH,COL.brg,0,0,-D.brgH/2)); brg.add(ring(D.bore/2+2,D.bore/2,D.brgH+2,COL.chrome,0,0,-D.brgH/2));
  brg.position.set(cx,cy,0); add(pre+'brg',brg,V(0,0,-110));
  const thr=new THREE.Group(); thr.add(ring(D.thrOD/2,D.bore/2,1,COL.chrome,0,0,-0.5)); thr.add(ring(D.thrOD/2-1.5,D.bore/2+1.5,D.thrH-2,COL.brg,0,0,-D.thrH/2)); thr.add(ring(D.thrOD/2,D.bore/2,1,COL.chrome,0,0,-D.thrH+0.5));
  thr.position.set(cx,cy,zB); add(pre+'thr',thr,V(0,0,-90));
  const pl=steerPlate(sx,right); pl.position.set(cx,cy,zP); add(pre+'plate',pl,V(0,0,-120));
  const pb=screw(D.bore,D.pivotL,0,COL.bolt,true); pb.rotation.x=Math.PI; pb.position.set(cx,cy,zP); add(pre+'pivot',pb,V(0,0,-110));
  const n=nut(D.bore,D.nutH); n.position.set(cx,cy,zN+D.nutH/2); add(pre+'nut',n,V(0,0,-80));
  const bp=box(56,100,D.blackT,COL.black,cx+sx*D.bpU,cy,zK+D.blackT/2); add(pre+'black',bp,V(0,0,-130));
  D.slots.forEach(([u,v],i)=>{ const s=screw(5,D.m5Lf,3.5); s.rotation.x=Math.PI; s.position.set(cx+sx*u,cy+v,zK-0.1); add(pre+'m5_'+i,s,V(0,0,-80));
    const g=new THREE.Group(); const w=washer(20,5.3,1.2); w.position.z=zP+D.plateT+0.6; const nn=nut(5,4); nn.position.z=zP+D.plateT+1.2+2; g.add(w,nn); g.position.set(cx+sx*u,cy+v,0); add(pre+'m5n_'+i,g,V(0,0,60)); });
}
corner(-1,false,'L'); corner(1,true,'R');
// tie rod: heim joints on top of the two arms
const armL=V(-XR+(-1)*D.arm[0]*-1, YAX+D.arm[1], 0); armL.x=-XR-(D.arm[0]); const armR=V(XR+D.arm[0],YAX+D.arm[1],0);
const zt=zP+D.plateT+D.heimT/2;
function heim(at,dir){ const g=new THREE.Group(); g.add(ring(D.heimOD/2,D.heimBore/2,D.heimT,COL.chrome,at.x,at.y,zt)); g.add(rodBetween(V(at.x,at.y,zt).addScaledVector(dir,D.heimOD/2-1),V(at.x,at.y,zt).addScaledVector(dir,D.heimL),D.heimShank/2,COL.chrome)); return g; }
const dir=new THREE.Vector3().subVectors(armR,armL).setZ(0).normalize();
add('heimL',heim(armL,dir),V(0,0,80)); add('heimR',heim(armR,dir.clone().negate()),V(0,0,80));
add('tierod',rodBetween(V(armL.x,armL.y,zt).addScaledVector(dir,D.heimL-6),V(armR.x,armR.y,zt).addScaledVector(dir,-(D.heimL-6)),D.rodD/2,COL.chrome),V(0,0,90));
for(const [k,a] of [['hbL',armL],['hbR',armR]]){ const g=new THREE.Group(); const s=screw(D.heimBore,D.heimBoltL,5); s.position.set(a.x,a.y,zt+D.heimT/2+0.1); const nn=nut(D.heimBore,6); nn.position.set(a.x,a.y,zP-3); g.add(s,nn); add(k,g,V(0,0,90)); }
// actuator under the right plate; back pin on a bracket under a short 2020 piece hung under the left side rail
const actH=V(XR+D.acth[0],YAX+D.acth[1],zP-6), PX=D.pin[0], PY=D.pin[1], stubZ=-10;
const pin=V(PX,PY,stubZ-10-D.brkPinH);
const stub=new THREE.Group(); stub.add(rail(D.stubL,'x',-XR+D.stubL/2-10,PY,stubZ)); add('stub',stub,V(0,0,-120));
// L corner bracket: one leg on the side rail's inner face, one on top of the short piece
const lb=new THREE.Group(); lb.add(box(3,20,20,COL.bolt,-XR+11.5,PY,10)); lb.add(box(20,20,3,COL.bolt,-XR+22,PY,1.5));
add('lbrk',lb,V(60,0,0));
{ const s1=screw(5,10,3.5); s1.rotation.y=Math.PI/2; s1.position.set(-XR+13+3.5,PY,10); s1.rotation.set(0,-Math.PI/2,0); add('lsA',s1,V(50,0,0)); }
{ const s2=screw(5,10,3.5); s2.position.set(-XR+24,PY,3); add('lsB',s2,V(0,0,50)); }
const brk=new THREE.Group(); const bz=stubZ-10;
brk.add(box(D.brkW,D.brkD,3,COL.bolt,pin.x,pin.y,bz-1.5));
brk.add(box(D.brkW,D.brkEar,D.brkPinH+6,COL.bolt,pin.x,pin.y-12,bz-(D.brkPinH+6)/2)); brk.add(box(D.brkW,D.brkEar,D.brkPinH+6,COL.bolt,pin.x,pin.y+12,bz-(D.brkPinH+6)/2));
add('bracket',brk,V(0,0,-100));
for(const dx of [-D.brkHoles/2,D.brkHoles/2]){ const g=new THREE.Group(); const s=screw(5,12,3.5); s.rotation.x=Math.PI; s.position.set(pin.x+dx,pin.y,bz-3.2); g.add(s); add('brkscrew'+dx,g,V(0,0,-60)); }
const ad=new THREE.Vector3().subVectors(actH,pin); const an=ad.clone().normalize();
const act=new THREE.Group(); const p0=pin.clone().addScaledVector(an,D.actRear), p1=pin.clone().addScaledVector(an,D.actMotorL);
act.add(rodBetween(p0,p1,D.actMotorR,COL.act,32)); act.add(rodBetween(p1,pin.clone().addScaledVector(an,D.actRet-D.actFront),D.actTubeR,COL.act,32));
act.add(rodBetween(pin.clone().addScaledVector(an,D.actRet-D.actFront-5),actH.clone().addScaledVector(an,-4),D.actRod/2,COL.chrome));
add('actuator',act,an.clone().multiplyScalar(-160));
add('actpinB',cyl(D.actPin/2,D.brkPinL,COL.chrome,pin.x,pin.y,pin.z),V(0,0,-60));
{ const g=new THREE.Group(); const s=screw(6.35,32,4.5); s.position.set(actH.x,actH.y,zP+D.plateT+0.1); const nn=nut(6.35,6); nn.position.set(actH.x,actH.y,actH.z-10); g.add(s,nn); add('actpinF',g,V(0,0,80)); }
// back corner: spacers between the rail and your black plate
const bx=-XR, by=-YAX;
const bk=box(56,100,D.blackT,COL.black,bx-D.bpU,by,-D.spacerL-D.blackT/2); add('Bblack',bk,V(0,0,-130));
const bholes=D.slots.map(([u,v])=>[bx-u,by+v]);
bholes.forEach(([x,y],i)=>{ add('Bsp'+i,cyl(D.spacerOD/2,D.spacerL,COL.spacer,x,y,-D.spacerL/2,6),V(0,0,-70));
  const s=screw(5,D.m5L,3.5); s.rotation.x=Math.PI; s.position.set(x,y,-D.spacerL-D.blackT-0.1); add('Bscr'+i,s,V(0,0,-90));
  const g=new THREE.Group(); const tn=box(6,10,4,COL.bolt,x,y,1.8); g.add(tn); add('Btn'+i,g,V(0,y<by?-90:90,0)); });
// ---- the steps ----
const S=window.STEPS;
const DUR=3.8, ANIM=1.6, TOTAL=S.length*DUR+2.5;
const stepIn={}; S.forEach((s,i)=>s.add.forEach(id=>{ Object.keys(P).filter(k=>k===id||k.startsWith(id+'*')||(id.endsWith('*')&&k.startsWith(id.slice(0,-1)))).forEach(k=>stepIn[k]=i); }));
const ease=e=>e<=0?0:e>=1?1:1-Math.pow(1-e,3);
const stepEl=document.getElementById('step'), barEl=document.querySelector('#bar i'), tagEl=document.getElementById('tag');
let lastStep=-1; const camT=new THREE.Vector3(), camP=new THREE.Vector3();
function focus(n){ const s=S[n]; return {t:V(...s.cam.t), r:s.cam.r, az:s.cam.az, el:s.cam.el}; }
function state(t){
  const n=Math.max(0,Math.min(S.length-1,Math.floor(t/DUR))), local=t-n*DUR, e=ease(local/ANIM);
  for(const k in P){ const it=P[k]; const st=stepIn[k]; const vis=st!==undefined&&st<=n; it.g.visible=vis; if(!vis) continue;
    const f=(st===n)?1-e:0; it.g.position.copy(it.from).multiplyScalar(f);
    const hot=(st===n)&&local<DUR-0.3; it.g.traverse(ch=>{ if(ch.isMesh) ch.material.emissive?.setHex(hot?0x332200:0); }); }
  if(n!==lastStep){ lastStep=n; stepEl.innerHTML=`<small>Step ${n+1} of ${S.length}</small>${S[n].t}`; }
  barEl.style.width=(100*Math.min(1,t/TOTAL))+'%';
  if(!userCam){ const a=focus(n), b=n>0?focus(n-1):a, k=ease(Math.min(1,local/1.2));
    const tt=b.t.clone().lerp(a.t,k), r=b.r+(a.r-b.r)*k, az=b.az+(a.az-b.az)*k, el=b.el+(a.el-b.el)*k;
    cam.position.set(tt.x+r*Math.cos(az)*Math.cos(el),tt.y+r*Math.sin(az)*Math.cos(el),tt.z+r*Math.sin(el)); ctl.target.copy(tt); }
}
function fit(){ const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
addEventListener('resize',fit); fit();
let t=0, playing=!REC, tPrev=performance.now();
const playb=document.getElementById('play');
playb.onclick=()=>{ playing=!playing; playb.textContent=playing?'❚❚ Pause':'▶ Play'; };
document.getElementById('next').onclick=()=>{ t=Math.min(S.length-1,Math.floor(t/DUR)+1)*DUR; userCam=false; };
document.getElementById('prev').onclick=()=>{ t=Math.max(0,Math.floor(t/DUR)-1)*DUR; userCam=false; };
document.getElementById('again').onclick=()=>{ t=0; userCam=false; playing=true; playb.textContent='❚❚ Pause'; };
window.__total=TOTAL; window.__frame=tt=>{ state(tt); ctl.update(); renderer.render(scene,cam); return true; };
state(0); window.__ready=true;
if(!REC) (function loop(){ requestAnimationFrame(loop); const now=performance.now(); if(playing) t=Math.min(TOTAL,t+(now-tPrev)/1000); tPrev=now;
  state(t); ctl.update(); renderer.render(scene,cam); })();
</script>
</body></html>
