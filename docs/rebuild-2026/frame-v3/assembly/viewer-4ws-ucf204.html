// ---- buy list on the card + floating 3D labels + front parts panel ----
const BUY=window.BUY||[], CHIP={buy:'buy',have:'have it',back:'back, later'};

const labsEl=document.getElementById('labs'), labSvg=labsEl.querySelector('svg'); let showAll=false, labStep=-1, labItems=[];
document.getElementById('alllab').onclick=e=>{ showAll=!showAll; e.target.textContent=showAll?'Hide old labels':'Show all labels'; labStep=-1; };
function labText(i){ return `<b>${esc(i.lab||i.n)}</b> — ${chip(i.st)}${i.ps?` <span class="note">(${esc(i.ps)})</span>`:''}`; }

const _bx=new THREE.Box3(), _v=new THREE.Vector3();
function placeLabels(){ const W=canvas.clientWidth, H=canvas.clientHeight; cam.updateMatrixWorld(); const card=stepEl.getBoundingClientRect(), key=document.getElementById('key').getBoundingClientRect();
  const placed=[card,key]; if(plist.style.display==='block') placed.push(plist.getBoundingClientRect()); let lines='';

// front parts list panel (PARTS-FRONT.md, buy order)
const plist=document.getElementById('plist'), FL=window.FRONT_LIST;
if(FL) plist.innerHTML=`<button class="x" id="plx">Close</button><h3>Front steering parts list</h3><div class="note">2 corners + 1 axle, in buy order. Back comes later. Prices only where a real listing was read.</div>

<h4>To buy, in this order ${chip('buy')}</h4><table>${FL.buy.map(([o,q,n,w,pr,l])=>`<tr><td><b>${o}.</b></td><td class="q"><b>${q}</b></td><td>${esc(n)}<br><span class="note">${esc(w)}</span></td><td>${pr?esc(pr):''}${l?` <a href="${l}" target="_blank" rel="noopener">link</a>`:''}</td></tr>`).join('')}</table>
<div class="tot">Front total, verified prices: ${esc(FL.total)}</div>`;
const showPanel=v=>{ plist.style.display=v?'block':'none'; }; window.__panel=showPanel;

window.__showAll=v=>{ showAll=v; labStep=-1; };

let t=0, playing=!REC, tPrev=performance.now();
const playb=document.getElementById('play');
